<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistem Informasi Data Kos | Tambah Penghuni</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>Sistem Informasi Data Kos</h1>
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../kamar/list.html">Daftar Kamar</a></li>
                <li><a href="../kamar/tambah.html">Tambah Kamar</a></li>
                <li><a href="list.html">Daftar Penghuni</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Penghuni</h2>
            <form>
                <p>
                    <label for="nama">Nama</label><br>
                    <input type="text" id="nama" name="nama" required>
                </p>

                <p>
                    <label for="no_kamar">No. Kamar</label><br>
                    <input type="text" id="no_kamar" name="no_kamar" required>
                </p>

                <p>
                    <label for="no_hp">No. HP</label><br>
                    <input type="text" id="no_hp" name="no_hp" required>
                </p>

                <p>
                    <label for="tanggal_masuk">Tanggal Masuk</label><br>
                    <input type="date" id="tanggal_masuk" name="tanggal_masuk" required>
                </p>

                <p>
                    <label for="status">Status</label><br>
                    <select id="status" name="status">
                        <option value="aktif">Aktif</option>
                        <option value="keluar">Sudah Keluar</option>
                    </select>
                </p>

                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sistem Informasi Data Kos &mdash; Jobsheet 3</p>
    </footer>
</body>
</html>
